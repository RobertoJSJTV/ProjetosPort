<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- aparecer quando compartilha o link  -->
    <meta name="description" content="Clientes que querem estilo moderno sem pagar preços absurdos">
    <link rel="icon" href="img/IconLogo.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="img/IconLogo.png">
    <!-- Open Graph (Facebook, WhatsApp, etc.) - use URL absoluto para produção -->
    <meta property="og:title" content="UrbanVibe Wear">
    <meta property="og:description" content="Clientes que querem estilo moderno sem pagar preços absurdos">
    <meta property="og:image" content="img/logo.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="UrbanVibe Wear">

    <meta name="WhatsApp:card" content="summary_large_image">
    <meta name="WhatsApp:title" content="UrbanVibe Wear">
    <meta name="whatsApp:description" content="Clientes que querem estilo moderno sem pagar preços absurdos">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="UrbanVibe Wear">
    <meta name="twitter:description" content="Clientes que querem estilo moderno sem pagar preços absurdos">
    <meta name="twitter:image" content="img/logo.png">
    <title>UrbanVibe Wear - Cadastro</title>

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand urban fw-bold" href="#">UrbanVibe Wear</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav6">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav6">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="LojaRoupas.html">Loja</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Produtos</a></li>
                </ul>
                <a href="#" class="btn"><i class="fa-solid fa-user" data-bs-toggle="modal"
                        data-bs-target="#modalLogin"></i>
                    Login/Registrar-se</a>

            </div>
        </div>
    </nav>

    <div class="modal fade" id="modalLogin" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Entrar na Conta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" class="form-control" id="loginEmail">
                        </div>
                        <div class="mb-3">
                            <label>Senha</label>
                            <input type="password" class="form-control" id="loginSenha">
                        </div>
                    </form>
                    <a href="" class="log" data-bs-toggle="modal" data-bs-target="#modalCadastro">Não tem uma conta?
                        Cadastre-se</a>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-warning" onclick="Logar()">Entrar</button>
                </div>

            </div>
        </div>
    </div>
    <!-- modal Cadastro -->
    <div class="modal fade" id="modalCadastro" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Criar Conta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label>Nome</label>
                            <input type="text" class="form-control" id="nomeUsuario" aria-label="Digite seu nome">
                        </div>
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" class="form-control" id="email" aria-label="Digite o email">
                        </div>
                        <div class="mb-3">
                            <label>Senha</label>
                            <input type="password" class="form-control" id="senha" aria-label="Digite sua senha">
                        </div>
                    </form>
                    <a href="" class="log" data-bs-toggle="modal" data-bs-target="#modalLogin">já tem uma conta? Acesse
                        aqui</a>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-warning" onclick="cadastroUsuario()">Entrar</button>
                </div>

            </div>
        </div>
    </div>

    <section>
        <div id="areaAdmin" class="container mt-5">
            <div class="row">
                <div class="col-md-3">
                    <input type="text" class="form-control" placeholder="Nome do Produto" id="nome" required>
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" placeholder="Descrição do Produto" id="descricaoProduto"
                        required>
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control" placeholder="Quantidade de estoque" id="Qtd" required>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="valor" id="valor" required>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-4">
                    <input class="form-control" type="text" placeholder="url da imagem aqui" id="imgURL">
                </div>
                <div class="col-md-4">
                    <select class="form-control" id="categoria">
                        <option value="">Categorias</option>
                        <option value="blusa">blusas</option>
                        <option value="camisetas">Camisetas</option>
                        <option value="calcas">Calças</option>
                        <option value="calcados">Sapatos</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="button" class="btn btn-primary" onclick="cadastrarProduto()">Cadastrar
                        Produto</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal de alertas -->
    <div class="modal fade" tabindex="-1" aria-labelledby="modalRegistraDespesaLabel" id="modalRegistraDespesa">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer">
                    <button type="button" data-bs-dismiss="modal" class="btn" id="modalBotao"></button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row mt-5">
            <div class="col">
                <table class="table">
                    <thead>
                        <tr>
                            <th>id</th>
                            <th>nome</th>
                            <th>descricao</th>
                            <th>quantidade</th>
                            <th>Valor</th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEditar">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Editar Informações</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label>Nome</label>
                            <input type="text" class="form-control" id="editNome">
                        </div>
                        <div class="mb-3">
                            <label>Descrição</label>
                            <input type="text" class="form-control" id="editDescricao">
                        </div>
                        <div class="mb-3">
                            <label>Quantidade</label>
                            <input type="number" class="form-control" id="editQtd">
                        </div>
                        <div class="mb-3">
                            <label>Valor</label>
                            <input type="text" class="form-control" id="editValor">
                        </div>
                        <div class="mb-3">
                            <label>URL da Imagem</label>
                            <input type="text" class="form-control" id="editImgURL">
                        </div>
                        <div class="mb-3">
                            <label>Categoria do produto</label>
                            <input type="text" class="form-control" id="editCategoria">
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-success" onclick="salvarProduto()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background-image: url(img/estoq.png);
            background-size: cover;
            backdrop-filter: blur(5px);
            background-repeat: no-repeat;
            background-position: center;

        }
    </style>

    <script src="js/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
